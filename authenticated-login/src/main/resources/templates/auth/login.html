
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>

<body>
    <main class="auth-page">
        <section class="content-card auth-card">

            <span class="brand-icon" aria-hidden="true">A</span>
            <h1 class="auth-title">Iniciar sesión</h1>
            <p class="section-description mb-4">
                Entra para gestionar usuarios, roles y permisos.
            </p>

            <div class="app-alert app-alert-error" role="alert" th:if="${param.error}">
                Usuario o contraseña incorrectos.
            </div>
            <div class="app-alert app-alert-info" role="status" th:if="${param.logout}">
                Has cerrado sesión.
            </div>
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/mvc/auth/login}" method="post">
                <div class="form-field">
                    <label class="app-label" for="username">Usuario</label>
                    <input class="app-input" id="username" name="username" type="text"
                           autocomplete="username" required autofocus>
                </div>

                <div class="form-field">
                    <label class="app-label" for="password">Contraseña</label>
                    <input class="app-input" id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button class="btn-app btn-app-primary mt-2" type="submit">Entrar</button>
            </form>

            <p class="auth-switch">
                ¿No tienes cuenta?
                <a th:href="@{/mvc/auth/register}">Regístrate</a>
            </p>

        </section>
    </main>
</body>
</html>
