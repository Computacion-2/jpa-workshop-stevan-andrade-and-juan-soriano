spring.application.name=jpa-workshop
 
# Solo aplican al correr con el Tomcat embebido (spring-boot:run o java -jar).
# Si el WAR se despliega en un Tomcat externo, el puerto lo define Tomcat y la ruta base es el nombre del .war
server.port=8082
server.servlet.context-path=/jpa-workshop
 
# ---------- Data Source (H2 en memoria) ----------
# El nombre de la base (finanzas) debe ser el mismo que se escribe en el JDBC URL de la consola de H2
# DB_CLOSE_DELAY=-1 mantiene la base viva mientras la aplicacion este corriendo
# MODE=Oracle es necesario porque schema.sql usa NUMBER, VARCHAR2 y SYSTIMESTAMP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:finanzas;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=sa
 
# ---------- JPA / Hibernate ----------
# Las tablas las crea schema.sql, por eso Hibernate no debe crearlas ni borrarlas (none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
 
# Ejecuta schema.sql y luego data.sql cada vez que arranca la aplicacion
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
 
# ---------- Consola web de H2 ----------
# Con el servidor corriendo: http://localhost:8081/jpa-workshop/h2-console
# En el login poner:
#   JDBC URL: jdbc:h2:mem:finanzas
#   User Name: sa
#   Password: sa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Por defecto la consola solo abre desde la misma maquina. Si se despliega en otro equipo
# y se quiere abrir desde su navegador, se necesita la siguiente linea (solo para el taller)
# spring.h2.console.settings.web-allow-others=true
 
# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.example=INFO
 
# ---------- Pool de conexiones (HikariCP) ----------
# Maximo de conexiones en el pool
spring.datasource.hikari.maximum-pool-size=10
# Minimo de conexiones inactivas que se mantienen
spring.datasource.hikari.minimum-idle=5
# Milisegundos que una conexion inactiva puede esperar antes de cerrarse
spring.datasource.hikari.idle-timeout=30000
# Milisegundos de vida maxima de una conexion antes de recrearla
spring.datasource.hikari.max-lifetime=1800000
# Milisegundos maximos esperando una conexion del pool antes de fallar
spring.datasource.hikari.connection-timeout=20000